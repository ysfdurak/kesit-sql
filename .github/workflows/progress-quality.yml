name: Progress quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sürüm bildirimi (release-manifest.json) özetleri doğru mu
        run: node tests/manifest.cjs
      - name: kaynak dalındaki depo vakası kopyası güncel mi
        run: |
          git fetch --depth=1 origin kaynak
          git diff --exit-code FETCH_HEAD:vaka/depo/index.html HEAD:vaka/depo/index.html || (echo "kaynak dalındaki vaka/depo/index.html main'deki vaka/depo/index.html ile aynı değil; kaynak dalını güncelle." && exit 1)
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tests/recovery.cjs recovery.js
      - run: node tests/artifact.cjs
      - run: node tests/vaka-depo.cjs
