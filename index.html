<style>
/* Düzen: solda menü (gezinme + SQL türü seçimi), sağda çalışma alanı; telefonda alt sekme çubuğu.
   Kimlik: Likya Yolu işaret boyası (kırmızı-beyaz şerit); seviyeler Temel → Orta → İleri tırmanış. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#141C27; --muted:#5A6576; --line:#D8DEE6;
  --accent:#C62F27; --accent-soft:#FBE7E5; --accent-ink:#FFFFFF;
  --ok:#17855A; --ok-ink:#fff; --ok-soft:#E1F3EA; --warn:#A86A12; --warn-soft:#FBF0DD; --err:#C0392B; --err-soft:#FBE6E3;
  --code-bg:#121A24; --code-ink:#DCE4EE; --code-kw:#FF8A7A; --code-fn:#8FC8FF; --code-str:#B8E07A; --code-num:#F5C26B; --code-com:#7F8DA1; --code-var:#E2A8FF; --code-line:#223042; --code-tab:#1A2431;
  --l1:#1F7F47; --l2:#0B7A70; --l3:#3866D1; --l4:#7A4FD0; --l5:#B8418F; --l6:#D3352C; --lv-ink:#fff;
  /* Yol simgeleri iki temada da aynı renk, üstünde beyaz yazı (4,5:1 üzeri) */
  --p2:#0B7A70; --p3:#3866D1; --p4:#7A4FD0; --p5:#B8418F; --p6:#D3352C;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,28,39,.06), 0 4px 16px rgba(20,28,39,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --surface:#141C26; --surface-2:#18212D; --ink:#E6ECF3; --muted:#93A0B3; --line:#263242;
  --accent:#F05A4F; --accent-soft:#3A1D1D; --accent-ink:#1A0B0A;
  --ok:#45C08A; --ok-ink:#0B1220; --ok-soft:#14302A; --warn:#E3A84B; --warn-soft:#352A16; --err:#FF7B6E; --err-soft:#3A1F1E;
  --code-bg:#0A1017; --code-line:#1E2A38; --code-tab:#111923;
  --l1:#4CC27E; --l2:#3CC4B4; --l3:#6E93F0; --l4:#A585F0; --l5:#E06BB6; --l6:#F05A4F; --lv-ink:#0B1220;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#141C26; --surface-2:#18212D; --ink:#E6ECF3; --muted:#93A0B3; --line:#263242;
  --accent:#F05A4F; --accent-soft:#3A1D1D; --accent-ink:#1A0B0A;
  --ok:#45C08A; --ok-ink:#0B1220; --ok-soft:#14302A; --warn:#E3A84B; --warn-soft:#352A16; --err:#FF7B6E; --err-soft:#3A1F1E;
  --code-bg:#0A1017; --code-line:#1E2A38; --code-tab:#111923;
  --l1:#4CC27E; --l2:#3CC4B4; --l3:#6E93F0; --l4:#A585F0; --l5:#E06BB6; --l6:#F05A4F; --lv-ink:#0B1220;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
a{color:var(--accent)}
button,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--f-display); line-height:1.15; text-wrap:balance; margin:0; letter-spacing:-.01em}
h1{font-size:clamp(1.7rem, 4vw, 2.4rem); font-weight:800}
h2{font-size:1.35rem; font-weight:700}
h3{font-size:1.08rem; font-weight:700}
code,kbd{font-family:var(--f-mono); font-size:.88em}
p code, li code, td code, .q code{background:var(--surface-2); border:1px solid var(--line); padding:.05em .35em; border-radius:5px}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; font-weight:600; color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Kabuk */
.app{display:grid; grid-template-columns:252px minmax(0,1fr); min-height:100%}
.side{position:sticky; top:0; height:100vh; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:20px 14px; gap:16px; overflow-y:auto}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px; text-decoration:none; color:var(--ink)}
.brand b{font-family:var(--f-display); font-weight:800; font-size:1.25rem; letter-spacing:-.02em}
.brand b span{color:var(--accent)}
.marker{width:26px; height:26px; display:block; flex:none}
.marker svg{display:block}
.brand b span{margin-left:.28em; font-weight:700; color:var(--accent)}
.dsel{display:flex; flex-direction:column; gap:4px; padding:10px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface-2)}
.dsel label{font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; font-weight:600; color:var(--muted)}
.dsel select{border:1px solid var(--line); background:var(--surface); border-radius:7px; padding:7px 8px; font-weight:600}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{display:flex; align-items:center; gap:10px; padding:9px 10px; border:0; background:none; border-radius:8px; text-align:left; color:var(--muted); font-weight:500}
.nav button:hover{background:var(--surface-2); color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft); color:var(--accent)}
.nav svg{width:18px; height:18px; flex:none}
.nav-g{font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; font-weight:700; color:var(--muted); padding:12px 10px 3px}
.nav-g:first-child{padding-top:0}
.nav button{padding:7px 10px}
.fam{border-top:1px solid var(--line); padding:12px 8px 0; display:flex; flex-direction:column; gap:4px; font-size:.82rem}
.fam b{font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}
.fam a{color:var(--muted); text-decoration:none} .fam a:hover{color:var(--accent); text-decoration:underline}
.sq-res{position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:40; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); max-height:60vh; overflow:auto; display:flex; flex-direction:column; padding:6px}
.sq-res button{display:block; width:100%; text-align:left; border:0; background:none; color:var(--ink); font:inherit; font-size:.86rem; padding:7px 8px; border-radius:7px; cursor:pointer}
.sq-res button:hover{background:var(--surface-2)} .sq-res small{display:block; color:var(--muted); font-size:.74rem}
.sq-res .sq-h{font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; font-weight:700; color:var(--muted); padding:6px 8px 2px}
.menu-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px}
.menu-grp{padding:14px; display:flex; flex-direction:column; gap:2px}
.menu-grp h2{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:0 0 6px; font-family:var(--f-body); font-weight:700}
.menu-grp button,.menu-grp a{display:flex; align-items:center; gap:10px; padding:10px 8px; border:0; background:none; border-radius:8px; color:var(--ink); font:inherit; font-weight:500; text-align:left; text-decoration:none; cursor:pointer}
.menu-grp button:hover,.menu-grp a:hover{background:var(--surface-2)} .menu-grp svg{width:18px; height:18px; flex:none; color:var(--muted)}
.chip.skip{border-style:dashed; color:var(--muted)}
.litem.skipped b{color:var(--muted)}
.ptopics{display:flex; flex-direction:column; gap:6px} .ptopic{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:8px; align-items:center; font-size:.9rem}
.ptopic i{font-style:normal; font-weight:700} .ptopic.ok i{color:var(--ok)} .ptopic.no i{color:var(--err)}
.path-sec{display:flex; flex-direction:column; gap:12px}
.adv-note{font-size:.85rem; color:var(--muted); border-left:3px solid var(--warn); padding:6px 10px; background:var(--warn-soft); border-radius:0 8px 8px 0}
.steps button.adv{border-style:dashed}
#main:focus{outline:none}
.legal-foot{max-width:1100px; margin:28px auto 8px; padding:0 20px 8px; font-size:.75rem; color:var(--muted)}
@media (max-width:860px){.legal-foot{padding-bottom:72px}}
.side-stats{margin-top:auto; border-top:1px solid var(--line); padding:14px 8px 0; display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stat b{display:block; font-family:var(--f-display); font-size:1.3rem; font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem; color:var(--muted)}
.engine{font-size:.75rem; color:var(--muted); display:flex; align-items:center; gap:6px; grid-column:1/-1}
.dot{width:8px; height:8px; border-radius:50%; background:var(--warn); flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--err)}
main{min-width:0; padding-block:28px 64px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.wrap{max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:28px}
.tabbar{display:none}
.topbar{display:none}

/* Genel öğeler */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--surface); padding:9px 16px; border-radius:8px; font-weight:600; font-size:.92rem; text-decoration:none; color:var(--ink); white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:none; border-color:transparent}
.btn.sm{padding:6px 11px; font-size:.84rem}
.btn:disabled{opacity:.5; cursor:not-allowed}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.grow{flex:1 1 auto; min-width:0}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:.75rem; font-weight:600; padding:3px 9px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); color:var(--muted); white-space:nowrap}
button.chip{cursor:pointer} button.chip:hover{border-color:var(--muted); color:var(--ink)}
button.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.lv{display:inline-grid; place-items:center; min-width:48px; height:22px; padding:0 8px; border-radius:5px; font-weight:600; font-size:.72rem; color:var(--lv-ink); letter-spacing:.02em; white-space:nowrap}
.lv-temel{background:var(--l1)} .lv-orta{background:var(--l3)} .lv-ileri{background:var(--l6)}
.bar{height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; border:1px solid var(--line)}
.bar i{display:block; height:100%; background:var(--accent); border-radius:99px}
.input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit}
.sec-head{display:flex; align-items:end; justify-content:space-between; gap:12px; flex-wrap:wrap}

/* Ana sayfa */
.hero{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:20px; align-items:stretch}
.hero-main{padding:28px; display:flex; flex-direction:column; gap:14px; position:relative; overflow:hidden}
.hero-main p{margin:0; max-width:56ch; color:var(--muted)}
.hero-main h1 em{font-style:normal; color:var(--accent)}
.stripe{position:absolute; right:-30px; top:22px; width:150px; height:54px; display:grid; grid-template-rows:1fr 1fr 1fr; transform:rotate(-8deg); opacity:.9}
.stripe i:nth-child(odd){background:var(--accent)} .stripe i:nth-child(2){background:var(--surface-2)}
.today{padding:22px; display:flex; flex-direction:column; gap:14px}
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.kpi{background:var(--surface-2); border-radius:8px; padding:12px}
.kpi b{display:block; font-family:var(--f-display); font-size:1.6rem; line-height:1.1; font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem; color:var(--muted)}
.continue{display:flex; gap:14px; align-items:center; padding:14px; border-radius:8px; border:1px dashed var(--line)}
.continue .grow b{display:block}
.chooser{padding:22px; display:flex; flex-direction:column; gap:14px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
.chooser .opts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.chooser .opts button{display:flex; flex-direction:column; gap:4px; align-items:flex-start; text-align:left; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2)}
.chooser .opts button b{font-family:var(--f-display); font-size:1.02rem}
.chooser .opts button small{color:var(--muted); font-size:.76rem; line-height:1.35}
.chooser .opts button[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 -3px 0 var(--accent); background:var(--surface)}
.climb{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; align-items:end}
.stop{padding:18px; display:flex; flex-direction:column; gap:8px; cursor:pointer; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--r)}
.stop:hover{border-color:var(--muted)}
.stop .code{font-family:var(--f-display); font-weight:800; font-size:1.8rem; line-height:1}
.stop small{color:var(--muted); font-size:.82rem; line-height:1.4}
.stop:nth-child(1){min-height:160px} .stop:nth-child(2){min-height:190px} .stop:nth-child(3){min-height:220px}
.stop .bar{margin-top:auto}
.paths{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px}
.pcard{padding:18px; display:flex; flex-direction:column; gap:10px; text-align:left; cursor:pointer; border:1px solid var(--line); background:var(--surface); border-radius:var(--r)}
.pcard:hover{border-color:var(--muted)}
.ic{min-width:38px; height:38px; padding:0 8px; border-radius:8px; display:grid; place-items:center; color:#fff; font-family:var(--f-display); font-weight:800; font-size:.9rem}
.pcard p{margin:0; color:var(--muted); font-size:.9rem}
.pcard .foot{display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); margin-top:auto}

/* Listeler */
.lessons{display:flex; flex-direction:column}
.litem{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px; border:0; border-top:1px solid var(--line); background:none; text-align:left; width:100%}
.litem:first-child{border-top:0}
.litem:hover{background:var(--surface-2)}
.litem b{font-weight:600; display:block}
.litem small{color:var(--muted); display:block; font-size:.82rem; line-height:1.4}
.check{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center}
.check.done{border:0; background:var(--ok); color:var(--ok-ink)}
.check.part{border-color:var(--ok)}
.check svg{width:13px; height:13px}
.lvl-block{display:flex; flex-direction:column; gap:10px}
.lvl-head{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.mod-head{padding:10px 14px 6px; font-size:.74rem; text-transform:uppercase; letter-spacing:.09em; font-weight:600; color:var(--muted); border-top:1px solid var(--line); background:var(--surface-2)}
.mod-head:first-child{border-top:0; border-radius:var(--r) var(--r) 0 0}
.filters{display:flex; gap:8px; flex-wrap:wrap}
.filters button{border:1px solid var(--line); background:var(--surface); padding:6px 12px; border-radius:99px; font-size:.84rem; font-weight:500; color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

/* Ders */
.lhead{display:flex; flex-direction:column; gap:12px}
.crumbs{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:.85rem; color:var(--muted)}
.crumbs button{border:0; background:none; padding:0; color:var(--muted); text-decoration:underline; text-underline-offset:3px}
.steps{display:flex; gap:5px; flex-wrap:wrap}
.steps button{height:30px; min-width:30px; padding:0 9px; border-radius:6px; border:1px solid var(--line); background:var(--surface); font-size:.78rem; font-weight:600; color:var(--muted); font-family:var(--f-mono)}
.steps button[aria-current="true"]{border-color:var(--ink); color:var(--ink); box-shadow:inset 0 -3px 0 var(--accent)}
.steps button.done{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.theory{padding:28px clamp(18px,4vw,40px); max-width:900px}
.theory > *{max-width:76ch}
.theory h2{margin:30px 0 10px} .theory h2:first-child{margin-top:0}
.theory h3{margin:22px 0 8px}
.theory ul, .theory ol{padding-left:1.3em}
.theory table{border-collapse:collapse; font-size:.88rem; margin:12px 0}
.theory th, .theory td{border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top}
.theory th{background:var(--surface-2)}
.tbl-wrap{overflow-x:auto; max-width:100% !important}
.note,.tip,.warn{border-radius:8px; padding:12px 14px; margin:14px 0; font-size:.94rem; border:1px solid}

.k{color:var(--code-kw); font-weight:600} .f{color:var(--code-fn)} .s{color:var(--code-str)} .n{color:var(--code-num)} .c{color:var(--code-com); font-style:italic} .v{color:var(--code-var)}

<script>
(function(){
'use strict';
document.documentElement.lang='tr';
let installEvt=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installEvt=e; try{ renderStats(); }catch(er){} });
window.addEventListener('appinstalled', ()=>{ installEvt=null; try{ renderStats(); toast('Kesit SQL yüklendi'); }catch(er){} });
const DX = window.SQLP_DIALECT, DIAL = DX.DIALECTS, DNAME = DX.DNAME, DIDS = DIAL.map(d=>d.id);
const DDESC = { tsql:'Microsoft SQL Server, Azure SQL. Kurumsal dünyada çok yaygın.', pg:'Açık kaynak, standarda en sadık. Girişimler ve bulut.', mysql:'Web uygulamalarının klasiği. MariaDB de benzer.', oracle:'Bankacılık ve büyük kurumlar. PL/SQL.', bq:'Google Cloud veri ambarı. GA4, pazarlama ve büyük veri analitiği.', sqlite:'Telefonlar ve uygulamalar içinde gömülü. Bu uygulamanın motoru.' };
/* ---------- Veri ---------- */
const LVMAP = {A1:'temel',A2:'temel',B1:'orta',B2:'orta',C1:'ileri',C2:'ileri'};
const LEVELS = [
  {id:'temel', name:'Temel', desc:'İlk sorgu, filtreleme, sıralama, toplama ve gruplama, fonksiyonlar, tablo oluşturma ve ilk JOIN\'ler', c:'l1'},
  {id:'orta', name:'Orta', desc:'Tüm JOIN türleri, alt sorgular, CTE, pencere fonksiyonları, pivot, işlemler, view ve tablo tasarımı', c:'l3'},
  {id:'ileri', name:'İleri', desc:'Sorgu planı ve performans, saklı yordam ve trigger, eşzamanlılık, veri ambarı, SQL türlerine özgü konular', c:'l6'}
];
const LESSONS = (window.SQLP_LESSONS || []);
const LMAP = {}; LESSONS.forEach((l,i)=>{ l._i=i; l.L = LVMAP[l.lv] || l.lv; LMAP[l.id]=l; });
const PATHS = window.SQLP_PATHS || []; const PMAP = {}; PATHS.forEach(p=>PMAP[p.id]=p);
const GLOSSARY = window.SQLP_GLOSSARY || []; const CHEATS = window.SQLP_CHEATS || [];
const PLACEMENT = (window.SQLP_PLACEMENT || []).map(q=>Object.assign({}, q, {L: LVMAP[q.lv] || q.lv})).map((q,i)=>[q,i]).sort((a,b)=>['temel','orta','ileri'].indexOf(a[0].L)-['temel','orta','ileri'].indexOf(b[0].L)||a[1]-b[1]).map(x=>x[0]);
const COLMETA = window.SQLP_COLMETA || {}; const TABLES = Object.keys(COLMETA);
const lvOrder = id => LEVELS.findIndex(l=>l.id===id);
const lvName = id => (LEVELS[lvOrder(id)]||{}).name || id;
const lvBadge = id => '<span class="lv lv-'+id+'">'+lvName(id)+'</span>';
const EXTRA_MODS = ['Veri Analisti','BT İş Analizi','Veri Bilimi','Veri Mühendisliği','Mülakat Hazırlığı','SQL Türlerine Özgü','İş Zekâsı ve Raporlama','Veritabanı Yönetimi (DBA)','Uygulama Geliştirme','Vaka Çalışmaları','Yapay Zekâ ile SQL','BigQuery ve Bulut Veri Ambarları','Sertifika Hazırlık','Alıştırma Kampı','Bitirme Projeleri','Kanat Havayolları','Büyük Sorgular','İK Analitiği','Büyük Veriyle Çalışmak','Sorgu Optimizasyonu','SQL Server Operasyon'];
(function hints(){ const dc=[], tc=[], all=[], dt=[]; for(const t of TABLES) for(const [c,ty] of COLMETA[t]){ all.push(c); if(/date/.test(ty)) dc.push(c); if(ty==='datetime') dt.push(c); if(/^text/.test(ty)) tc.push(c); } DX.setSchemaHints(dc, tc, all, dt); })();

/* ---------- Depolama ---------- */
const KEY='sqlpatika.v1';
function load(){ try{ return JSON.parse(KESIT_STORAGE.getItem(KEY)) || {}; }catch(e){ return {}; } }
/* Pilot özeti: yalnız bu tarayıcıda durur, ağ isteği yok, kişisel veri yok. Kullanıcı kopyalarsa dışarı çıkar. */
function pilotBos(){ return {tests:[], aktifDk:0, dersBaslangic:{}, dersBitis:{}, takilma:{}}; }
function pilotKirp(t){ return t.length>20 ? [t[0]].concat(t.slice(-19)) : t; } /* ilk test silinmez */
function pilotNorm(p){ const b=pilotBos(); p=(p&&typeof p==='object')?p:{}; return {tests:Array.isArray(p.tests)?pilotKirp(p.tests):[], aktifDk:Math.max(0,+p.aktifDk||0), dersBaslangic:p.dersBaslangic||b.dersBaslangic, dersBitis:p.dersBitis||b.dersBitis, takilma:p.takilma||b.takilma}; }
function pilotBirlestir(a,b){ a=pilotNorm(a); b=pilotNorm(b); const g={}; a.tests.concat(b.tests).forEach(t=>{ g[[t.tarih,t.puan,t.toplam,t.seviye].join('|')]=t; }); const ilk=(x,y)=>{ const o=Object.assign({},x); for(const k in y) if(!o[k]||String(y[k])<String(o[k])) o[k]=y[k]; return o; }; const tk=Object.assign({},a.takilma); for(const k in b.takilma) tk[k]=Math.max(tk[k]||0,b.takilma[k]); return {tests:pilotKirp(Object.values(g).sort((x,y)=>String(x.tarih)<String(y.tarih)?-1:1)), aktifDk:Math.max(a.aktifDk,b.aktifDk), dersBaslangic:ilk(a.dersBaslangic,b.dersBaslangic), dersBitis:ilk(a.dersBitis,b.dersBitis), takilma:tk}; }
const PILOT_SURUM='v13'; /* sw.js önbellek sürümüyle birlikte artır */
const DEFAULTS = () => ({done:{}, ex:{}, xp:0, days:{}, placement:null, drafts:{}, last:null, seen:{}, dialect:'pg', dialectChosen:false, goal:null, goalChosen:false, rv:{}, rvc:0, dl:{}, theme:'auto', pilot:pilotBos()});
let P = Object.assign(DEFAULTS(), load()); P.pilot=pilotNorm(P.pilot);
function applyTheme(){ const r=document.documentElement; if(P.theme==='light'||P.theme==='dark') r.setAttribute('data-theme',P.theme); else r.removeAttribute('data-theme'); }
applyTheme();
if(!DIDS.includes(P.dialect)) P.dialect='pg';
if(P.placement && LVMAP[P.placement]) P.placement = LVMAP[P.placement];
let saveT=null;
let persistAsked=false;
function askPersist(){ if(persistAsked) return; persistAsked=true; try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persisted().then(ok=>ok||navigator.storage.persist()).catch(()=>{}); }catch(e){} }
let quotaWarned=false;
function save(){ if (KESIT_STORAGE.isBlocked()) return; askPersist(); clearTimeout(saveT); saveT=setTimeout(()=>{ try{ KESIT_STORAGE.setItem(KEY, JSON.stringify(P)); }catch(e){ if(!quotaWarned){ quotaWarned=true; try{ toast('İlerleme kaydedilemedi: tarayıcı depolaması dolu. Profil sayfasından dosyaya yedek al.'); }catch(er){} } } writeSummary(); },150); }
function writeSummary(){ try{ KESIT_STORAGE.setItem('kesit.ozet.sql', JSON.stringify({bitti:Object.keys(P.done).filter(k=>LMAP[k]).length, toplam:LESSONS.length, alistirma:Object.keys(P.ex).filter(k=>exByKey(k)).length})); }catch(e){} }
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => ymd(new Date());
function streak(){ let n=0; const d=new Date(); if(!P.days[today()]) d.setDate(d.getDate()-1); for(;;){ if(P.days[ymd(d)]){ n++; d.setDate(d.getDate()-1);} else break; } return n; }
function bestStreak(){ const ds=Object.keys(P.days).filter(k=>P.days[k]).sort(); let best=0, cur=0, prev=null; for(const k of ds){ const d=new Date(k+'T00:00:00'); if(prev && (d-prev)/864e5===1) cur++; else cur=1; best=Math.max(best,cur); prev=d; } return best; }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); }
function addXP(n){ if(!n) return; P.xp+=n; P.days[today()]=(P.days[today()]||0)+n; save(); renderStats(); }
const DAILY_GOAL = 50;

/* ---------- SQL motoru ---------- */
let SQL=null, BASE=null, engineState='loading';
let pgDb=null, pgEnv={procs:{}, funcs:{}, tvfs:{}, tran:0, nocount:false};
const waiters=[];
const engineReady = () => engineState==='ready';
function onEngine(fn){ engineReady()? fn() : waiters.push(fn); }
function fresh(){ const db=new SQL.Database(BASE); window.SQLP_REGISTER(db); DX.register(db); return db; }
(function boot(){
  if(typeof initSqlJs!=='function'){ engineState='error'; renderStats(); return; }
  initSqlJs().then(async S=>{
    SQL=S; let ok=false;
    try{
      if(location.protocol!=='file:'){
        const r=await fetch('base-'+window.SQLP_SEED_HASH()+'.b64.txt');
        if(r.ok){ const txt=(await r.text()).trim(); const bin=atob(txt); let buf=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
          if(buf[0]===0x1f && buf[1]===0x8b && typeof DecompressionStream==='function'){ const ds=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')); buf=new Uint8Array(await new Response(ds).arrayBuffer()); }
          const t=new S.Database(buf); t.exec('SELECT 1 FROM bk_trips LIMIT 1'); t.close(); BASE=buf; ok=true; }
      }
    }catch(e){ ok=false; }
    if(!ok){ const db=new S.Database(); window.SQLP_EXEC_SEED(db, {small:true}); BASE=db.export(); db.close(); window.SQLP_SMALL=true; }
    pgDb=fresh(); engineState='ready'; renderStats();
    waiters.splice(0).forEach(f=>{ try{f();}catch(e){console.error(e);} });
    setTimeout(()=>{ const m=$('#main'); if(m && /Motor yükleniyor/.test(m.textContent||'')) render(); },0);
    document.querySelectorAll('[data-needs-engine]').forEach(b=>b.disabled=false);
  }).catch(()=>{ engineState='error'; renderStats(); });
})();
function run(db, code, d, env){ const r=DX.runDialect(db, code, d, {env: env || {procs:{}, funcs:{}, tvfs:{}, tran:0, nocount:false}}); if(r&&r.error&&d!=='sqlite') LASTERR={code:String(code).slice(0,4000), d, error:r.error}; return r; }
const lastSet = r => r && r.sets && r.sets.length ? r.sets[r.sets.length-1] : null;

/* ---------- Yardımcılar ---------- */
const $ = (s,el=document)=>el.querySelector(s);

  let out='', m;
  while((m=re.exec(src))){
    if(m[1]) out+='<span class="c">'+esc(m[1])+'</span>';
    else if(m[2]) out+='<span class="s">'+esc(m[2])+'</span>';
    else if(m[3]) out+=esc(m[3]);
    else if(m[4]) out+='<span class="v">'+esc(m[4])+'</span>';
    else if(m[5]) out+='<span class="n">'+m[5]+'</span>';
    else if(m[6]){ const w=m[6]; if(KW.has(w.toUpperCase())) out+='<span class="k">'+w+'</span>'; else if(/^\s*\(/.test(src.slice(re.lastIndex))) out+='<span class="f">'+w+'</span>'; else out+=w; }
    else out+=esc(m[7]);

}

/* Süre tahmini (üç uygulamada aynı formül): okuma + kod görevi başına 2-3 dk + çoktan seçmeli başına 0,5-1 dk. Ölçülmüş değil; ekranda aralık ve "tahmin" olarak görünür. */
function sureDk(l) { if (l._sr) return l._sr; const ch = String(l.body || '').replace(/<[^>]+>/g, '').length, ex = (l.ex || []).filter(e => e), kolay = ex.filter(e => e.t === 'mc').length, kod = ex.length - kolay, r = Math.max(3, ch / 600); return (l._sr = [r + 2 * kod + .5 * kolay, r + 3 * kod + kolay]); }
function dkAralik(l) { const [a, b] = sureDk(l); if (b < 90) return Math.max(5, Math.floor(a / 5) * 5) + '-' + Math.ceil(b / 5) * 5 + ' dk'; const y = x => (Math.round(x / 30) / 2).toLocaleString('tr-TR'); return y(a) + '-' + y(b) + ' saat'; }
function saatAralik(ls) { if (!ls.length) return '0 dk'; const a = ls.reduce((s, l) => s + sureDk(l)[0], 0) / 60, b = ls.reduce((s, l) => s + sureDk(l)[1], 0) / 60; if (b < 1) return 'yaklaşık ' + Math.max(5, Math.floor(a * 12) * 5) + '-' + Math.ceil(b * 12) * 5 + ' dk'; const st = b < 10 ? 1 : 5, lo = Math.max(1, Math.floor(a / st) * st), hi = Math.ceil(b / st) * st; return 'yaklaşık ' + lo + '-' + (hi > lo ? hi : lo + st) + ' saat'; }

function isSkipped(l){ return !!(P.placement && l && !P.done[l.id] && lvOrder(l.L)<lvOrder(P.placement) && !(P.placementWrong||[]).includes(l.id)); }

/* Şıkları soruya özgü, her açılışta aynı kalan bir sırayla karıştır ("Hepsi", "Hiçbiri" gibi şıklar sonda kalır) */
function mcOrder(opts, key){
  let h=2166136261; const ks=String(key); for(let i=0;i<ks.length;i++){ h^=ks.charCodeAt(i); h=Math.imul(h,16777619); }
  const rnd=()=>{ h|=0; h=(h+0x6D2B79F5)|0; let t=Math.imul(h^(h>>>15),1|h); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
  const pin=o=>/^\s*(hepsi|hiçbiri|yukarıdaki|her ikisi|ikisi de)/i.test(String(o).replace(/<[^>]+>/g,''));
  const free=[], tail=[]; opts.forEach((o,i)=>(pin(o)?tail:free).push(i));
  for(let i=free.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [free[i],free[j]]=[free[j],free[i]]; }
  return free.concat(tail);
}

    if(t.k==='com'){ W(t.v); if(t.v.startsWith('--')) nl(); prev=null; continue; }
    if(t.k==='p' && t.v===';'){ out=out.replace(/\s+$/,'')+';\n\n'; lineStart=true; depth=0; stack.length=0; plain.length=1; plain[0]=0; prev=t; clause=''; continue; }
    if(t.k==='p' && t.v==='('){ const n=sig(i+1); const sub=n && n.k==='w' && (n.u==='SELECT' || n.u==='WITH');
      const fn=prev && (prev.k==='w' && !KW.has(prev.u) || prev.k==='q');
      if(fn || (prev && prev.k==='p' && prev.v==='(')) { out+='('; lineStart=false; } else W('(');
      if(sub){ stack.push(true); plain.push(0); depth++; } else { stack.push(false); plain[plain.length-1]++; }
      prev=t; continue; }
    if(t.k==='p' && t.v===')'){ const wasSub=stack.pop(); if(wasSub){ plain.pop(); depth=Math.max(0,depth-1); nl(')'); } else { plain[plain.length-1]=Math.max(0,plain[plain.length-1]-1); out+=')'; lineStart=false; } prev=t; continue; }
    if(t.k==='p' && t.v===','){ out+=','; if(top && clause==='SELECT') nl('       '); else if(top && clause==='WITH') nl(); else lineStart=false; prev=t; continue; }
    if(t.k==='w' && top){
      const nxt=sig(i+1);
      if(CL_BREAK.has(u) && !(u==='FETCH' && clause==='OFFSET') && !(u==='SET' && clause==='UPDATE' && false)){
        if(u==='WITH' && nxt && nxt.k==='w' && ['TIES','ROLLUP','CUBE'].includes(nxt.u)) { W(up(t)); prev=t; continue; }
        if(out.trim()) nl(); W(up(t)); clause=(u==='GROUP'||u==='ORDER')?'GROUPBY':u; if(u==='UNION'||u==='EXCEPT'||u==='INTERSECT'||u==='MINUS'){ if(nxt && nxt.u==='ALL'){ i++; W('ALL'); } nl(); } prev=t; continue; }
      if(['LEFT','RIGHT','INNER','FULL','CROSS','NATURAL','OUTER'].includes(u) && nxt && ['JOIN','OUTER','APPLY'].includes(nxt.u) && !(prev && ['LEFT','RIGHT','FULL','CROSS','NATURAL','OUTER'].includes(prev.u))){ nl(); W(up(t)); clause='FROM'; prev=t; continue; }
      if(u==='JOIN' && !(prev && ['LEFT','RIGHT','INNER','FULL','CROSS','NATURAL','OUTER'].includes(prev.u))){ nl(); W(up(t)); clause='FROM'; prev=t; continue; }
      if(u==='BETWEEN') between=true;
      if((u==='AND'||u==='OR') && (clause==='WHERE'||clause==='HAVING'||clause==='FROM')){ if(u==='AND' && between){ between=false; } else { nl('    '); W(up(t)); prev=t; continue; } }
      if(['UPDATE','DELETE','INSERT','MERGE','CREATE','ALTER','DROP'].includes(u) && lineStart===false && prev && prev.k==='p' && prev.v===';'){ nl(); }
    }
    W(t.k==='w' ? up(t) : t.v); prev=t;
  }
  return out.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim()+'\n';
}

    const dbS=fresh(); if(t.sql) try{ dbS.exec(t.sql); }catch(e){} const sr=run(dbS,c.sol,'sqlite'); dbS.close();
    const dbU=fresh(); if(t.sql) try{ dbU.exec(t.sql); }catch(e){} const ur=run(dbU,code,d); const apf=(!i&&!ur.error&&c.plan)?DX.planFail(c,dbU,ur):null; dbU.close(); if(!i) firstR=ur;
    if(ur.error){ out.push({ad:t.ad, ok:false, why:'Hata: '+ur.error+(ur.hint?' '+ur.hint:'')}); break; }
    const cm=compare(lastSet(ur), lastSet(sr), c.ord ? (/eşitlikte/i.test(c.q) ? 'strict' : true) : false); if(cm.ok&&apf){ cm.ok=false; cm.why='Sonuç doğru, plan beklenen gibi değil. '+apf.msg+(apf.plan?' Planın: '+apf.plan.replace(/\n/g,' | '):''); } out.push({ad:t.ad, ok:cm.ok, why:cm.why}); }
  const all=out.length===cases.length&&out.every(x=>x.ok);
  const html='<div class="msg '+(all?'ok':'err')+'"><b>'+(all?'Tüm testler geçti':'Bazı testler geçmedi')+'</b><div class="ar-tests">'+out.map((x,i)=>'<div class="ar-test '+(x.ok?'ok':'no')+'"><i>'+(x.ok?'✓':'✗')+'</i><span>'+(i?'Gizli test '+i:'Örnek veri')+(i&&!x.ok?': '+esc(x.ad):'')+(x.ok?'':'<br><span class="muted">'+esc(x.why)+'</span>')+'</span></div>').join('')+(out.length<cases.length?'<div class="ar-test no"><i>·</i><span class="muted">Kalan '+(cases.length-out.length)+' test çalıştırılmadı.</span></div>':'')+'</div>';
  return {out, all, firstR, html};
}

function arWeek(){ const d=new Date(); const t=new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=t.getUTCFullYear(); const w=Math.ceil(((t-Date.UTC(y,0,1))/86400000+1)/7); return y+'-H'+String(w).padStart(2,'0'); }

  const c=ARCH[ARS.items[ARS.cur]];

function arDetMount(c){

  const dk='__det:'+c.id+':'+ARS.d;
  ED=makeEditor($('#ed'), P.drafts[dk]!==undefined?P.drafts[dk]:c.start, arDetRun, ARS.d, c.tables, true);
  ED.onChange=v=>{ P.drafts[dk]=v; save(); };
  onEngine(()=>{ const el=$('#detSchema'); if(el) arDetSchema(el); const done=arP().det[c.id]||0; for(let i=0;i<Math.min(done,c.steps.length);i++) arDetAns(c,i); if(done){ document.querySelectorAll('.det-step.done').forEach((el,i)=>{ if(!el.querySelector('.muted')) el.insertAdjacentHTML('beforeend','<div class="muted" style="font-size:.85rem;margin-top:4px">Cevap: <b>'+esc(ARS.ans[i])+'</b></div>'); }); } });

function arDetSchema(el){ el.innerHTML=schemaHTML(arDetDb(), ARS.d); el.querySelectorAll('details').forEach(d=>{ if(!ARDET[ARS.id].tables.some(t=>d.querySelector('summary').textContent.indexOf(t)===0)) d.remove(); }); }
function arDetRun(){ if(!engineReady()||!ED) return; const code=ED.get(); if(!code.trim()) return; const r=run(arDetDb(),code,ARS.d); $('#res').innerHTML=resultHTML(r); }
function arDetCheck(){
  const c=ARDET[ARS.id]; const a=arP(); const i=a.det[c.id]||0; if(i>=c.steps.length) return; const inp=$('#detIn'); const v=inp?inp.value:''; if(!v.trim()) return;
  const exp=arDetAns(c,i); const ok = typeof exp==='number' ? Math.abs(Number(String(v).replace(',','.'))-exp)<0.01 : detNorm(v)===detNorm(exp);
  if(ok){ a.det[c.id]=i+1; save(); arGain(20,'Dedektif adım '+(i+1)); if(i+1===c.steps.length) setTimeout(()=>arGain(50,'Vaka çözüldü'),400); render(); }
  else { const fb=$('#detFb'); if(fb) fb.innerHTML='<div class="msg err" style="margin-top:8px"><b>Bu değil</b>Sorgunu ve koşullarını tekrar kontrol et. Büyük/küçük harf önemli değil.</div>'; }
}

let AI={fn:undefined, ctl:null, busy:false, out:'', sql:'', note:'', lastErr:null, q:''};
function aiInit(){
  if(AI.fn!==undefined){ aiShow(); return; }
  const u = window.claude && window.claude.use ? window.claude.use('sample') : Promise.resolve(null);
  Promise.resolve(u).then(f=>{ AI.fn=f||null; aiShow(); }).catch(()=>{ AI.fn=null; aiShow(); });
}
function aiShow(){ const el=$('#aiBox'); if(el) el.hidden=!AI.fn; const ex=$('#exAi'); if(ex) ex.hidden=!AI.fn; }
function aiPanelHTML(){
  return '<section class="panel ai" id="aiBox"'+(AI.fn?'':' hidden')+'><div class="ai-head"><span class="eyebrow">Yapay zekâya sor</span><small class="muted">Soruyu Türkçe yaz; seçili SQL türünde SQL üretilir. Çalıştırmadan önce kontrol et.</small></div><textarea class="input" id="aiQ" rows="2" placeholder="Örn. 2024\'te en çok ciro yapan 5 müşteri ve sipariş sayıları">'+esc(AI.q)+'</textarea><div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn pri sm" data-act="ai-sql"'+(AI.busy?' disabled':'')+'>SQL yaz</button><button class="btn sm" data-act="ai-explain"'+(AI.busy?' disabled':'')+'>Editördeki sorguyu açıkla</button><button class="btn sm" data-act="ai-review"'+(AI.busy?' disabled':'')+'>Sorguyu denetle</button>'+(AI.busy?'<button class="btn ghost sm" data-act="ai-stop">Durdur</button>':'')+'</div><div id="aiOut">'+aiOutHTML()+'</div></section>';
}
function aiOutHTML(){
  if(!AI.out && !AI.note) return '';
  return '<div class="ai-out">'+(AI.out?'<div class="ai-text">'+esc(AI.out)+'</div>':'')+(AI.sql&&!AI.busy?'<div class="row" style="gap:8px"><button class="btn pri sm" data-act="ai-use">Editöre aktar ve çalıştır</button></div>':'')+(AI.note?'<p class="muted" style="margin:0;font-size:.85rem">'+esc(AI.note)+'</p>':'')+'</div>';
}
function aiRender(){ const o=$('#aiOut'); if(o) o.innerHTML=aiOutHTML(); const b=$('#aiBox'); if(b){ b.querySelectorAll('[data-act=ai-sql],[data-act=ai-explain],[data-act=ai-review]').forEach(x=>x.disabled=AI.busy); const st=b.querySelector('[data-act=ai-stop]'); if(AI.busy&&!st){ const x=document.createElement('button'); x.className='btn ghost sm'; x.dataset.act='ai-stop'; x.textContent='Durdur'; b.querySelector('.row').appendChild(x); } if(!AI.busy&&st) st.remove(); } }
function aiSchema(d){ return TABLES.map(t=>t+'('+COLMETA[t].map(c=>c[0]+' '+window.SQLP_TYPE(c[1],d)+(c[3]==='pk'?' PK':c[3]&&c[3].startsWith('fk:')?' FK→'+c[3].slice(3):'')).join(', ')+')').join('\n'); }
const AI_RULES='İş kuralları: net tutar = quantity * unit_price * (1 - discount). Ciroya yalnızca status = \'delivered\' siparişler girer. orders.status değerleri: delivered, shipped, cancelled, returned. Market verisi 2022-2024 yıllarını kapsar. Banka tablolarında (bank_*) amount girişte artı, çıkışta eksidir ve hesabın para birimindedir; TL karşılığı için bank_fx kur tablosu (iş günleri) kullanılır.';
function aiCall(kind){
  if(!AI.fn||AI.busy) return; const d=playD||P.dialect, name=DNAME[d]; const q=($('#aiQ')||{}).value||''; AI.q=q; const code=ED?ED.get():'';
  let prompt;
  if(kind==='sql'){ if(!q.trim()){ AI.out=''; AI.sql=''; AI.note='Önce sorunu yaz.'; aiRender(); return; }
    prompt='Sen bir SQL öğretmenisin. Aşağıdaki şemaya göre '+name+' ('+(d==='bq'?'GoogleSQL; tablolar anadolu veri setinde':d==='tsql'?'T-SQL':name)+') yazımıyla tek bir SELECT sorgusu yaz. Yalnızca şemadaki tablo ve sütunları kullan.\n\nŞema:\n'+aiSchema(d)+'\n\n'+AI_RULES+'\n\nSoru: '+q+'\n\nYanıt biçimi: önce ```sql kod bloğu içinde sorgu, ardından Türkçe 2-4 maddelik kısa açıklama (hangi tabloları neden birleştirdin, dikkat edilecek nokta). Başka bir şey yazma.'; }
  else { if(!code.trim()){ AI.out=''; AI.sql=''; AI.note='Editör boş.'; aiRender(); return; }
    const errTxt = AI.lastErr ? '\n\nBu sorgu çalıştırıldığında şu hata alındı: '+AI.lastErr : '';
    prompt = kind==='explain'
      ? 'Sen bir SQL öğretmenisin. Aşağıdaki '+name+' sorgusunu yeni başlayan birine Türkçe, adım adım ve kısa açıkla (SQL\'in mantıksal işlem sırasını izle: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY). Hata varsa nedenini ve düzeltilmiş sorguyu ```sql bloğunda ver.\n\nŞema:\n'+aiSchema(d)+'\n\nSorgu:\n'+code+errTxt
      : 'Sen deneyimli bir veri analistisin. Aşağıdaki '+name+' sorgusunu sessiz hatalar açısından denetle: JOIN kaynaklı satır çoğalması, LEFT JOIN sonrası WHERE filtresi, tam sayı bölmesi, NULL davranışı, tarih aralığı, iş kurallarına uygunluk, performans. Türkçe kısa maddeler yaz; gerekiyorsa düzeltilmiş sorguyu ```sql bloğunda ver.\n\nŞema:\n'+aiSchema(d)+'\n\n'+AI_RULES+'\n\nSorgu:\n'+code+errTxt; }
  AI.ctl=new AbortController(); AI.busy=true; AI.out='Düşünüyor…'; AI.sql=''; AI.note=''; aiRender();
  AI.fn(prompt,{signal:AI.ctl.signal, onText:({text})=>{ AI.out=text; const o=$('#aiOut .ai-text'); if(o) o.textContent=text; else aiRender(); }})
    .then(r=>{ AI.out=r.text; AI.note=r.truncated?'Yanıt kısaltıldı; soruyu daraltmayı dene.':'Yapay zekâ hata yapabilir; sonucu kendin doğrula.'; })
    .catch(e=>{ const c=e&&e.code; AI.out=(e&&e.text)||''; if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){ AI.fn=null; aiShow(); return; } AI.note = c==='cancelled'?'Durduruldu.':c==='rate_limited'?'Çok sık istek gönderildi; biraz sonra tekrar dene.':c==='refused'?'Bu istek yanıtlanmadı; soruyu değiştir.':'Bir sorun oluştu; tekrar deneyebilirsin.'; })
    .finally(()=>{ AI.busy=false; const m=AI.out.match(/```(?:sql)?\s*\n([\s\S]*?)```/i); AI.sql=m?m[1].trim():''; aiRender(); });
}
function pgRun(){
  if(!engineReady()) return; const code=ED.get(); if(!code.trim()) return;
  const r=run(pgDb,code,playD,pgEnv); AI.lastErr=r.error?(r.error+(r.hint?' ('+r.hint+')':'')):null; $('#res').innerHTML=resultHTML(r); $('#cmpBox').innerHTML=''; CMP=null;
  if(!r.error){ pgHistory=[code].concat(pgHistory.filter(x=>x!==code)).slice(0,8); renderHist(); if(/\b(create|drop|alter|insert|delete|update|into|merge)\b/i.test(code)) $('#pgSchema').innerHTML=schemaHTML(null, playD); if(!P.days[today()]) addXP(1); }
}
function renderHist(){ const h=$('#hist'); if(!h) return; h.innerHTML= pgHistory.length? '<div class="eyebrow" style="margin:6px 0">Bu oturumdaki sorgular</div><div class="panel lessons">'+pgHistory.map((q,i)=>'<button class="litem" data-hist="'+i+'" style="grid-template-columns:minmax(0,1fr)"><code style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">'+esc(q.replace(/\s+/g,' '))+'</code></button>').join('')+'</div>':''; }
function pgFreshForSchema(){ if(!window.__schemaDb) window.__schemaDb=fresh(); return window.__schemaDb; }
function schemaHTML(db, d){
  db = db || pgDb; d = d || P.dialect; if(!db) return '<div class="empty">Motor yükleniyor…</div>';
  const t=db.exec("SELECT name, type FROM sqlite_master WHERE type IN ('table','view') AND name NOT LIKE 'sqlite_%' UNION ALL SELECT name, type FROM sqlite_temp_master WHERE type = 'table' ORDER BY 2, 1");
  if(!t.length) return '<div class="empty">Tablo yok.</div>';
  let h='<div class="schema">';
  t[0].values.forEach(([n])=>{ let cnt='?'; try{ cnt=db.exec('SELECT COUNT(*) FROM "'+n+'"')[0].values[0][0]; }catch(e){}
    const meta=COLMETA[n]; let cols=[];
    if(meta) cols=meta.map(c=>[c[0], window.SQLP_TYPE(c[1], d), c[3]]);
    else { const c=db.exec("SELECT name,type,pk FROM pragma_table_info('"+n.replace(/'/g,"''")+"')"); cols=c[0]?c[0].values.map(([cn,ty,pk])=>[cn,ty,pk?'pk':'']):[]; }
    const shown = /^tmp_/.test(n) ? '#'+n.slice(4) : /^tv_/.test(n) ? '@'+n.slice(3) : n;
    h+='<details><summary>'+esc(shown)+'<span>'+num(cnt)+' satır</span></summary>'+(window.SQLP_SCHEMA_NOTES[n]?'<p>'+esc(window.SQLP_SCHEMA_NOTES[n])+'</p>':'')+'<ul>'+cols.map(([cn,ty,k])=>'<li><span>'+esc(cn)+(k==='pk'?' <span class="pk">PK</span>':k?' <span class="fk">FK</span>':'')+'</span><i>'+esc(ty||'')+'</i></li>').join('')+'</ul></details>'; });
  return h+'</div>';
}

/* Soru sırası seviye içinde karışır (kolaydan zora akış korunur), şıklar her denemede karışır, doğru şık konumları dengeli dağıtılır. */
function karistir(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function yeniTest(){ const sira=[]; ['temel','orta','ileri'].forEach(L=>{ karistir(PLACEMENT.map((q,i)=>[q,i]).filter(([q])=>q.L===L).map(x=>x[1])).forEach(i=>sira.push(i)); });
  const k=Math.max(1,...PLACEMENT.map(q=>q.o.length)); const konum=karistir(sira.map((_,n)=>n%k)); const sec={};
  sira.forEach((pi,n)=>{ const q=PLACEMENT[pi]; const diger=karistir(q.o.map((_,i)=>i).filter(i=>i!==q.a)); diger.splice(Math.min(konum[n],q.o.length-1),0,q.a); sec[pi]=diger; });
  return {i:0,ans:[],sira,sec,kayit:false}; }

    const lv=placementResult(); const correct=T.ans.filter(Boolean).length;

    const firstOf=L=>{ const c=currOrdered().filter(x=>x.L===L&&!isExtraLesson(x)); return c.find(x=>!P.done[x.id])||c[0]; };
    let start=null, startPath=null;
    if(wrong.length) start=LMAP[wrong[0].q.ls[0]];

    else start=firstOf(lv);

    P.placement=lv; P.placementWrong=wrongIds; P.placementStart=start?start.id:null; P.goalChosen=true; if(lv==='temel'&&!start) P.placementStart='ilk-sorgu'; if(!T.kayit){ T.kayit=true; P.dialectChosen=true; P.pilot.tests=pilotKirp(P.pilot.tests.concat([{tarih:new Date().toISOString(),puan:correct,toplam:PLACEMENT.length,seviye:lv}])); } save(); setTimeout(renderStats,0); gcEvent('seviye-testi/'+lv, 'Seviye testi: '+lv);

    h+='<section class="panel about-card"><div class="sec-head"><h3>Konu haritası</h3></div><div class="ptopics">'+rows.map(r=>'<div class="ptopic '+(r.ok?'ok':'no')+'"><i>'+(r.ok?'✓':'✗')+'</i><span>'+esc(r.q.topic||plain(r.q.q).slice(0,60))+' <span class="muted" style="font-size:.8rem">· '+lvName(r.q.L)+'</span></span>'+(!r.ok&&r.q.ls&&LMAP[r.q.ls[0]]?'<button class="btn sm ghost" data-lesson="'+r.q.ls[0]+'">Derse git</button>':'<span></span>')+'</div>').join('')+'</div></section>';

  }
  return h+'</div>';
}
function placementResult(){
  let res='temel';
  for(const L of LEVELS){ const idx=PLACEMENT.map((q,i)=>[q,i]).filter(([q])=>q.L===L.id); if(!idx.length) continue; const ok=idx.filter(([q,i])=>T.ans[i]).length; if(ok>=Math.ceil(idx.length*0.8)){ const nx=LEVELS[lvOrder(L.id)+1]; res=nx?nx.id:'ileri'; } else { res=L.id; break; } }
  return res;
}

    (window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null)).then(dl=>{
      if(dl) return dl.save({filename:fn, data:txt}).then(()=>show('Dosya kaydedildi. Yedek olarak aşağıdaki metni de saklayabilirsin.'), er=>show(er&&er.code==='declined'?'Kaydetme iptal edildi. İstersen aşağıdaki metni kopyalayıp sakla.':'Dosya kaydedilemedi; aşağıdaki metni kopyalayıp sakla.'));
      viaLink(); show('İndirme başlatıldı. Olmadıysa aşağıdaki metni kopyalayıp sakla.');
    }).catch(()=>{ viaLink(); }); }
  else if(a==='imp-show'){ $('#ioBox').innerHTML='<p class="muted" style="margin:0 0 6px;font-size:.85rem">Kaydettiğin ilerleme metnini yapıştır. Bu cihazdaki ilerlemeyle birleştirilir; hiçbir şey silinmez.</p><textarea id="impTa" aria-label="İlerleme metni" placeholder="{&quot;xp&quot;: ...}"></textarea><div class="row" style="margin-top:8px"><button class="btn sm pri" data-act="imp-do">İçe aktar</button></div>'; }
  else if(a==='imp-do'){ importProgress($('#impTa').value); }
  else if(a==='imp-file'){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json,text/plain'; inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return; f.text().then(importProgress); }; inp.click(); }
  else if(a==='feedback'){ gcEvent('geri-bildirim-acildi', 'Geri bildirim formu açıldı'); openFeedback(t.dataset.ders||''); }
});
/* Yedek: önce doğrula. Başka uygulamanın dosyası hiçbir şeyi değiştirmeden reddedilir. Birleştirirken hiçbir şey silinmez. */
function mergeP(a, b){
  if(a===undefined||a===null) return b; if(b===undefined||b===null) return a;
  if(Array.isArray(a)||Array.isArray(b)) return Array.isArray(a)&&(!Array.isArray(b)||a.length>=b.length)?a:b;
  if(typeof a==='object'&&typeof b==='object'){ const o={}; for(const k of new Set(Object.keys(a).concat(Object.keys(b)))) o[k]=mergeP(a[k],b[k]); return o; }
  if(typeof a==='number'&&typeof b==='number') return Math.max(a,b);
  if(typeof a==='boolean'||typeof b==='boolean') return !!(a||b);
  return a;
}
function checkBackup(txt){
  let o; try{ o=JSON.parse(txt); }catch(e){ return {err:'Bu metin okunamadı. Kesit SQL\'den indirilen ilerleme dosyasını seç.'}; }
  if(!o||typeof o!=='object') return {err:'Bu dosya bir Kesit SQL ilerleme dosyası değil.'};
  if(o.app && o.app!=='kesit-sql') return {err:'Bu dosya bir Kesit SQL ilerleme dosyası değil ('+String(o.app).slice(0,30)+'). Hiçbir şey değiştirilmedi.'};
  const d=o.ilerleme||o.data||o; if(!d||typeof d!=='object'||!('done' in d)||!('xp' in d)) return {err:'Bu dosya bir Kesit SQL ilerleme dosyası değil.'};
  const ids=Object.keys(d.done||{}); if(!o.app && ids.length){ const ok=ids.filter(id=>LMAP[id]).length; if(ok<ids.length/2) return {err:'Bu dosya bir Kesit SQL ilerleme dosyası değil; ders kimliklerinin çoğu bu uygulamada yok. Hiçbir şey değiştirilmedi.'}; }
  return {data:d};
}
function importProgress(txt){
  const r=checkBackup(txt); if(r.err){ toast(r.err); const b=$('#ioBox'); if(b) b.insertAdjacentHTML('afterbegin','<div class="msg err" style="margin-bottom:8px">'+esc(r.err)+'</div>'); return false; }
  const pl=pilotBirlestir(P.pilot, r.data.pilot); P=Object.assign(DEFAULTS(), mergeP(P, r.data)); P.pilot=pl; save(); applyTheme(); render(); renderStats(); toast('İlerleme yüklendi ve bu cihazdakiyle birleştirildi'); return true;
}
function giscusOn(){ const g=(window.KESIT_CONFIG||{}).giscus||{}; return !!(g.repo&&g.repoId&&g.category&&g.categoryId); }
function mountGiscus(term){
  const box=$('#gsBox'); if(!box||!giscusOn()) return; const g=window.KESIT_CONFIG.giscus; box.innerHTML='';
  const dark = P.theme==='dark' || (P.theme!=='light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const sc=document.createElement('script'); sc.src='https://giscus.app/client.js'; sc.async=true; sc.crossOrigin='anonymous';
  const at={repo:g.repo,'repo-id':g.repoId,category:g.category,'category-id':g.categoryId,mapping:'specific',term:term,strict:'1','reactions-enabled':'1','emit-metadata':'0','input-position':'top',theme:dark?'dark':'light',lang:'tr',loading:'lazy'};
  for(const k in at) sc.setAttribute('data-'+k, at[k]);
  box.appendChild(sc);
}
function feedbackUrl(ders, body){ const C=window.KESIT_CONFIG||{}; const u=C.feedbackFormUrl||''; if(u) return u.indexOf('{ders}')>=0 ? u.replace('{ders}', encodeURIComponent(ders||'Genel')) : u; const repo=(C.author||{}).repo; if(!repo) return ''; return repo.replace(/\/$/,'')+'/issues/new?title='+encodeURIComponent('Geri bildirim: '+(ders||'Genel'))+'&body='+encodeURIComponent(body||('Yer: '+(ders||'Genel')+'\nSQL türü: '+DNAME[P.dialect]+'\n\nNe gördüm:\n')); }
function openFeedback(ders, body){ const u=feedbackUrl(ders, body); if(u) window.open(u,'_blank','noopener'); }
function switchExDialect(d, text){
  if(!LS) return; const {e,k}=LS; if(!exAllowed(e).includes(d)){ toast('Bu alıştırma yalnızca '+exAllowed(e).map(x=>DNAME[x]).join(' / ')+' yazımıyla çözülür.'); return; }
  LS.d=d; P.drafts[k+'#d']=d; if(text!==undefined) P.drafts[k+':'+d]=text; save();
  const sel=$('#exD'); if(sel) sel.value=d;
  const init = P.drafts[k+':'+d]!==undefined ? P.drafts[k+':'+d] : (exText(e.start,e,d)||'');
  ED=makeEditor($('#ed'), init, ()=>submitEx(), d, tablesIn((e.sol||'')+' '+e.q)); ED.onChange=v=>{ if(!S.review){ P.drafts[k+':'+LS.d]=v; save(); } };
  $('#fb').innerHTML=''; $('#res').innerHTML='<div class="empty">SQL türü: '+esc(DNAME[d])+'. Sorgunu yaz ve çalıştır.</div>'; $('#solBox').innerHTML=''; $('#cmpBox').innerHTML=''; CMP=null;
}
function answerMC(i, btn){
  const {l,e,k}=LS; const box=$('#mc');
  box.querySelectorAll('button').forEach(b=>b.classList.remove('wrong'));
  if(i===e.a){ btn.classList.add('right'); const first=!P.ex[k]; P.ex[k]=1; if(first) addXP(5); LS.tries++; const extra=solvedHook(k, LS.tries===1); $('#mcFb').innerHTML='<div class="msg ok"><b>Doğru!'+(first?' +5 XP':'')+'</b>'+(e.why||'')+extra+'</div>'; afterSolve(l); }
  else { LS.tries++; btn.classList.add('wrong'); $('#mcFb').innerHTML='<div class="msg err"><b>Tekrar dene</b>'+(e.miss||(LS.tries>=2&&e.why?e.why:'Bu seçenek doğru değil. Konu anlatımına dönüp tekrar bakabilirsin.'))+'</div>'; }
}
document.addEventListener('keydown', ev=>{
  if((ev.ctrlKey||ev.metaKey) && (ev.key==='k'||ev.key==='K')){ ev.preventDefault(); const q=$('#sideQ'); if(q && q.offsetParent){ q.focus(); q.select(); } else { go('curr'); setTimeout(()=>{ const c=$('#currQ'); if(c) c.focus(); },0); } }
  if(ev.target && ev.target.id==='sideQ' && ev.key==='Enter'){ currFilter.q=ev.target.value; currFilter.lv='all'; go('curr'); ev.target.value=''; sideResults(''); }
  if(ev.target && ev.target.id==='sideQ' && ev.key==='Escape'){ ev.target.value=''; sideResults(''); }
});
document.addEventListener('input', ev=>{
  if(ev.target.id==='sideQ'){ sideResults(ev.target.value); return; }
  if(ev.target.id==='prQ'){ prFilter.q=ev.target.value; $('#prList').innerHTML=prListHTML(); return; }
  if(ev.target.id==='currQ'){ currFilter.q=ev.target.value; $('#currList').innerHTML=currList(); }
  if(ev.target.id==='dictQ'){ dictQ=ev.target.value; $('#glList').innerHTML=glList(); }
});
document.addEventListener('change', ev=>{
  const t=ev.target;
  if(t.matches('[data-dsel]')) { const keepPlay = S.view==='serbest'; if(keepPlay) playD=t.value; setDialect(t.value); return; }
  if(t.id==='exD'){ switchExDialect(t.value); return; }
  if(t.id==='prT'){ prFilter.t=t.value; $('#prList').innerHTML=prListHTML(); return; }
  if(t.id==='playD'){ playD=t.value; render(); return; }
  if(t.id==='sample' && t.value!==''){ const list=SAMPLES.concat(playD==='tsql'?TSQL_SAMPLES:[]); const it=list[+t.value]; const s= it[0].startsWith('T-SQL')? it[1] : DX.forward(it[1], playD); ED.set(s); P.drafts['__pg:'+playD]=s; save(); pgRun(); t.value=''; }
});
document.addEventListener('keydown', ev=>{ const g=ev.target.closest && ev.target.closest('.tbox'); if(g && (ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); g.dispatchEvent(new MouseEvent('click',{bubbles:true})); } });

/* ---------- Başlat ---------- */
function fromHash(){
  const h=(location.hash||'').slice(1);
  const m=h.match(/^ders-([^\/@]+)(?:\/(\d+))?(?:@(.+))?$/);
  if(m && LMAP[m[1]]) S={view:'lesson', id:m[1], step:Math.min(+(m[2]||0),(LMAP[m[1]].ex||[]).length), ctx:m[3]&&PMAP[m[3]]?m[3]:null};
  else if(h.startsWith('patika-') && PMAP[h.slice(7)]) S={view:'path', id:h.slice(7), step:0, ctx:h.slice(7)};
  else if(h.startsWith('pratik-') && PRMAP[h.slice(7)]) S={view:'pratiksoru', id:h.slice(7), step:0, ctx:null};
  else if(h.startsWith('oyun-')) S={view:'play', id:h.slice(5), step:0, ctx:null};
  else if(['paths','curr','play','serbest','test','dict','data','review','profile','pratik','sinav','hakkinda','menu','mulakat','projeler','belgeler','hatalar'].includes(h)) S={view:h, id:null, step:0, ctx:null};
  else S={view:'home', id:null, step:0, ctx:null};
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', fromHash);
/* Aktif dakika: sayfa görünür ve son 60 saniyede etkileşim varsa */
{ let sonEtki=Date.now(); ['pointerdown','keydown','scroll','touchstart'].forEach(ev=>addEventListener(ev,()=>{ sonEtki=Date.now(); },{passive:true,capture:true}));
  setInterval(()=>{ if(!document.hidden && Date.now()-sonEtki<=60000){ P.pilot.aktifDk++; save(); } },60000); }
window.KESIT_APP = { save:()=>save(), checkBackup,  event:(n,t)=>gcEvent(n,t), pathInfo:(id)=>{ const p=PMAP[id]; if(!p) return null; const ls=p.lessons.map(x=>LMAP[x]).filter(Boolean); return {id:p.id, name:p.name, short:p.short, color:p.color, skills:p.skills||[], lessons:ls.length, exercises:ls.reduce((a,l)=>a+(l.ex||[]).length,0), hours:saatAralik(ls).replace(/^yaklaşık | saat$/g,''), complete:ls.length>0&&ls.every(l=>P.done[l.id])}; }, getP:()=>P, replaceP:(np)=>{ P=Object.assign(DEFAULTS(), np||{}); applyTheme(); try{ KESIT_STORAGE.setItem(KEY, JSON.stringify(P)); }catch(e){} render(); renderStats(); }, fresh:()=>Object.assign(DEFAULTS(), {dialectChosen:false}), render:()=>{ render(); renderStats(); }, toast };
gcInit();
try{ if('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href) && !/claude|claudeusercontent/.test(location.host)) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
writeSummary();
fromHash();
})();
